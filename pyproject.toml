[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "waddlebag"
version = "0.1.0"
description = "Your Claude quota resets whether you use it or not. waddlebag spends what's left on tasks you hand it."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
waddlebag = "waddlebag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
waddlebag = ["examples/*"]
